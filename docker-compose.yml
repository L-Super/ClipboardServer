services:
  clipboard-server:
    image: ghcr.io/l-super/clipboardserver:latest
    container_name: clipboard-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # - ./.env:/app/.env
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3


